version: '3.8'

services:
  web:
    image: donfias/img_pizzeria:1.2
    container_name: web_pizzeria
    ports:
      - "8020:8080"    
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/pizzeria.db    
    volumes:
      - sqlite_data:/app/data    
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  sqlite_data:
    name: blazorpizzeria_data